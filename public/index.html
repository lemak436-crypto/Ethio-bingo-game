<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢትዮ ቢንጎ ጌም - Ethio Bingo</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .lobby-container { display: block; }
        .lucky-number-container { display: none; }
        .game-container { display: none; }
        
        /* 🎰 የአራዳ ቢንጎ ሰንጠረዥ ዲዛይን */
        .arada-table {
            width: 100%;
            max-width: 450px;
            margin: 15px auto;
            border-collapse: collapse;
            background-color: #1c2541;
            border-radius: 8px;
            overflow: hidden;
        }
        .arada-table th, .arada-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #3a506b;
            font-size: 14px;
        }
        .arada-table th { background-color: #121b3a; color: #5bc0be; font-weight: bold; }
        
        .play-btn {
            background-color: #009b4c;
            color: white;
            border: none;
            padding: 6px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 🔢 የ200 ዕድለኛ ቁጥሮች መምረጫ ሰሌዳ */
        .lucky-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-width: 390px;
            margin: 15px auto;
            background-color: #1c2541;
            padding: 8px;
            border-radius: 8px;
            max-height: 280px;
            overflow-y: auto;
        }
        .lucky-cell {
            background-color: #3a506b;
            color: white;
            padding: 8px 0;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #1c2541;
        }
        .lucky-cell.selected { background-color: #009b4c; }

        /* 🎫 ሰማያዊና ነጭ የቢንጎ ካርድ */
        .bingo-card-box {
            background-color: #ffffff;
            color: #000000;
            max-width: 340px;
            margin: 15px auto;
            border: 4px solid #0000ff;
        }
        .bingo-header-title {
            background-color: #0000ff; color: #ffffff;
            display: grid; grid-template-columns: repeat(5, 1fr);
            font-size: 34px; font-weight: bold; padding: 5px 0;
        }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background-color: #0000ff; }
        .cell { background-color: #ffffff; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #000000; cursor: pointer; }
        .cell.marked { background-color: #de1c24 !important; color: #ffffff !important; }
        .cell.free-space { color: #de1c24; font-size: 11px; flex-direction: column; font-weight: bold; }
        .current-call { font-size: 55px; color: #f1c40f; font-weight: bold; margin: 10px 0; background-color: #1c2541; display: inline-block; padding: 5px 30px; border-radius: 50px; }
    </style>
</head>
<body>

    <!-- 1. 🎰 ሎቢ ገጽ -->
    <div id="lobby" class="lobby-container">
        <h2 style="color:#f1c40f;">🎰 ኢትዮ ቢንጎ መጫወቻ ክፍሎች</h2>
        <table class="arada-table">
            <thead>
                <tr>
                    <th>Stake</th>
                    <th>Active</th>
                    <th>Players</th>
                    <th>Derash</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="color:#f1c40f; font-weight:bold;">10 ETB</td>
                    <td>Game</td>
                    <td><span id="players-10">0</span></td>
                    <td style="color:#009b4c; font-weight:bold;"><span id="derash-10">0</span> ETB</td>
                    <td><span id="timer-10" style="color:#e74c3c; font-weight:bold;">45s</span></td>
                    <td><button class="play-btn" onclick="openLuckySelection(10)">Play</button></td>
                </tr>
                <tr>
                    <td style="color:#f1c40f; font-weight:bold;">20 ETB</td>
                    <td>Game</td>
                    <td><span id="players-20">0</span></td>
                    <td style="color:#009b4c; font-weight:bold;"><span id="derash-20">0</span> ETB</td>
                    <td><span id="timer-20" style="color:#e74c3c; font-weight:bold;">30s</span></td>
                    <td><button class="play-btn" onclick="openLuckySelection(20)">Play</button></td>
                </tr>
                <tr>
                    <td style="color:#f1c40f; font-weight:bold;">50 ETB</td>
                    <td>Game</td>
                    <td><span id="players-50">0</span></td>
                    <td style="color:#009b4c; font-weight:bold;"><span id="derash-50">0</span> ETB</td>
                    <td><span id="timer-50" style="color:#e74c3c; font-weight:bold;">15s</span></td>
                    <td><button class="play-btn" onclick="openLuckySelection(50)">Play</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 2. 🔢 ባለ 200 ዕድለኛ ቁጥሮች መምረጫ ገጽ (Lucky Number) -->
    <div id="lucky-selection" class="lucky-number-container">
        <h2>🔢 እባክዎ አንድ ዕድለኛ ቁጥር ይምረጡ (1 - 200)</h2>
        <div class="lucky-grid" id="lucky-numbers-list"></div>
        <button class="play-btn" style="background-color:#7f8c8d; margin-right:10px;" onclick="location.reload()">ውጣ</button>
        <button class="play-btn" id="start-game-btn" disabled style="background-color:#7f8c8d;" onclick="confirmLuckyNumberAndGetCard()">Continue</button>
    </div>

    <!-- 3. 🎮 የቢንጎ መጫወቻ ገጽ -->
    <div id="game-room" class="game-container">
        <h3 id="room-title">ክፍል፦ 10 ETB</h3>
        <div id="lucky-number-display" style="font-size:18px; color:#f1c40f; margin-bottom:5px;">Bingo Card #--</div>
        <div id="game-status-text" style="color:#f1c40f; font-weight:bold;">የሰከንድ ቆጠራ ይጠብቁ...</div>
        
        <div id="active-game-panel" style="display:none;">
            <div>የሚወጣው ቁጥር፦</div>
            <div class="current-call" id="call-number">--</div>
        </div>
        
        <div class="bingo-card-box">
            <div class="bingo-header-title"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
            <div class="bingo-grid" id="bingo-board"></div>
        </div>
        <button class="play-btn" style="background-color:#009b4c; width:85%; font-size:22px; margin-top:10px;" onclick="alert('BINGO!')">BINGO!</button>
    </div>

    <script {
        const socket = io();
        let selectedStake = 0;
        let selectedLuckyNumber = null;

        socket.on('rooms_update', (roomsStatus) => {
            for (let id in roomsStatus) {
                const room = roomsStatus[id];
                document.getElementById(`players-${id}`).innerText = room.activePlayers;
                document.getElementById(`derash-${id}`).innerText = room.derash;
                document.getElementById(`timer-${id}`).innerText = room.countdown + "s";
            }
        });

        // ፕሌይ ሲባል የ200 ቁጥር ምርጫን መክፈቻ
        function openLuckySelection(stake) {
            selectedStake = stake;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('lucky-selection').style.display = 'block';
            
            const list = document.getElementById('lucky-numbers-list');
            list.innerHTML = "";
            for (let i = 1; i <= 200; i++) {
                const cell = document.createElement('div');
                cell.className = 'lucky-cell';
                cell.innerText = i;
                cell.onclick = () => {
                    selectedLuckyNumber = i;
                    document.querySelectorAll('.lucky-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    document.getElementById('start-game-btn').disabled = false;
                    document.getElementById('start-game-btn').style.backgroundColor = "#009b4c";
                };
                list.appendChild(cell);
            }
        }

        // ቁጥሩ ሲረጋገጥ ወደ ቢንጎ ቦርድ መቀየሪያ ሎጅክ
        function confirmLuckyNumberAndGetCard() {
            document.getElementById('lucky-selection').style.display = 'none';
            document.getElementById('game-room').style.display = 'block';
            document.getElementById('room-title').innerText = `ክፍል፦ ${selectedStake} ETB`;
            document.getElementById('lucky-number-display').innerText = `Bingo Card #\${selectedLuckyNumber}`;
            
            generateBingoCard();
        }

        function generateBingoCard() {
            const grid = document.getElementById('bingo-board');
            grid.innerHTML = "";
            const ranges = [{ min: 1, max: 15 }, { min: 16, max: 30 }, { min: 31, max: 45 }, { min: 46, max: 60 }, { min: 61, max: 75 }];
            let columns = [[], [], [], [], []];
            for (let col = 0; col < 5; col++) {
                let used = new Set();
                while (columns[col].length < 5) {
                    let num = Math.floor(Math.random() * (ranges[col].max - ranges[col].min + 1)) + ranges[col].min;
                    if (!used.has(num)) { used.add(num); columns[col].push(num); }
                }
                columns[col].sort((a, b) => a - b);
            }
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    if (row === 2 && col === 2) {

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢትዮ ቢንጎ ጌም - Mini App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        /* የክፍሎች (Lobby) ዲዛይን */
        .lobby-container { display: block; }
        .game-container { display: none; }
        
        .room-card {
            background: linear-gradient(135deg, #1c2541, #3a506b);
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #5bc0be;
        }
        .room-info { text-align: left; }
        .play-btn {
            background-color: #de1c24;
            color: white;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        /* የቢንጎ ጨዋታ ሰሌዳ ዲዛይን */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 360px;
            margin: 15px auto;
            background-color: #1c2541;
            padding: 10px;
            border-radius: 10px;
        }
        .cell {
            background-color: #3a506b;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .cell.called { background-color: #009b4c; color: white; }
        .current-call {
            font-size: 50px;
            color: #f1c40f;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- 1. የሎቢ (የመጫወቻ ክፍሎች) ገጽ -->
    <div id="lobby" class="lobby-container">
        <h2>🎰 ኢትዮ ቢንጎ መጫወቻ ክፍሎች</h2>
        <div class="room-card">
            <div class="room-info">
                <strong>💰 10 ETB ክፍል</strong><br>
                <span>ተጫዋቾች፦ 18</span>
            </div>
            <button class="play-btn" onclick="enterRoom(10)">Play</button>
        </div>
        <div class="room-card">
            <div class="room-info">
                <strong>💰 20 ETB ክፍል</strong><br>
                <span>ተጫዋቾች፦ 86</span>
            </div>
            <button class="play-btn" onclick="enterRoom(20)">Play</button>
        </div>
        <div class="room-card">
            <div class="room-info">
                <strong>💰 50 ETB ክፍል</strong><br>
                <span>ተጫዋቾች፦ 68</span>
            </div>
            <button class="play-btn" onclick="enterRoom(50)">Play</button>
        </div>
    </div>

    <!-- 2. የውስጥ ጨዋታ መጫወቻ ገጽ -->
    <div id="game-room" class="game-container">
        <h3 id="room-title">ክፍል፦ 10 ETB</h3>
        <div>የሚወጣው ቁጥር፦</div>
        <div class="current-call" id="call-number">--</div>
        
        <div class="bingo-grid" id="bingo-board"></div>
        <button class="play-btn" style="background-color:#009b4c; width:80%;" onclick="checkBingo()">BINGO!</button>
        <br><br>
        <button class="play-btn" style="background-color:#7f8c8d;" onclick="leaveRoom()">ውጣ (Leave)</button>
    </div>

    <script>
        let currentRoomStake = 0;
        const boardNumbers = [];

        function enterRoom(stake) {
            currentRoomStake = stake;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-room').style.display = 'block';
            document.getElementById('room-title').innerText = `ክፍል፦ ${stake} ETB`;
            generateNewBoard();
            startNumberCalling();
        }

        function leaveRoom() {
            document.getElementById('lobby').style.display = 'block';
            document.getElementById('game-room').style.display = 'none';
            clearInterval(gameTimer);
        }

        function generateNewBoard() {
            const grid = document.getElementById('bingo-board');
            grid.innerHTML = "";
            const used = new Set();
            for (let i = 0; i < 25; i++) {
                let num;
                do { num = Math.floor(Math.random() * 75) + 1; } while (used.has(num));
                used.add(num);
                boardNumbers.push(num);

                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = num;
                cell.id = `cell-${num}`;
                cell.onclick = () => {
                    // ተጫዋቹ የደረሰውን ቁጥር ሲነካ ምልክት ያደርጋል
                    cell.classList.toggle('called');
                };
                grid.appendChild(cell);
            }
        }

        let gameTimer;
        function startNumberCalling() {
            const calledNumbers = [];
            gameTimer = setInterval(() => {
                if (calledNumbers.length >= 75) { clearInterval(gameTimer); return; }
                let nextNum;
                do { nextNum = Math.floor(Math.random() * 75) + 1; } while (calledNumbers.includes(nextNum));
                calledNumbers.push(nextNum);
                
                document.getElementById('call-number').innerText = nextNum;
                
                // የአማርኛ ድምፅ ማጫወቻ ሎጅክ (የአራዳ ቢንጎ ኮፒ)
                speakNumber(nextNum);
            }, 4000); // በየ 4 ሰኮንዱ ቁጥር ይወጣል
        }

        function speakNumber(num) {
            // የቴሌግራም ብራውዘር የፅሁፍ ድምፅ ማጉያ (Speech Synthesis) በመጠቀም
            const msg = new SpeechSynthesisUtterance(`ቁጥር ${num}`);
            msg.lang = 'am-ET';
            window.speechSynthesis.speak(msg);
        }

        function checkBingo() {
            alert("ቢንጎ ተረጋግጧል! የእርስዎን ካርድ ሲስተሙ እየመረመረ ነው...");
        }
    </script>
</body>
</html>

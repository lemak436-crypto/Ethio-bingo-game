<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢትዮ ቢንጎ ጌም - Ethio Bingo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: linear-gradient(90deg, #de1c24, #009b4c);
            padding: 15px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 350px;
            margin: 0 auto;
            background-color: #162447;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .cell {
            background-color: #e43f5a;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cell.marked {
            background-color: #009b4c;
            transform: scale(0.95);
        }
        .btn-deposit {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .current-number {
            font-size: 48px;
            color: #f1c40f;
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">🎯 ኢትዮ ቢንጎ ጌም</div>
    
    <div class="status">የሚወጣው ቁጥር፦</div>
    <div class="current-number" id="lucky-number">--</div>

    <div class="bingo-board" id="board">
        <!-- የቢንጎ ቁጥሮች በጃቫስክሪፕት እዚህ ይገባሉ -->
    </div>

    <button class="btn-deposit" onclick="buyCard()">🎫 በቴሌብር/ባንክ ካርድ ግዛ (50 ETB)</button>

    <script>
        // የቢንጎ ሰሌዳ በዘፈቀደ ቁጥሮች መሥሪያ
        const board = document.getElementById('board');
        const usedNumbers = new Set();
        
        for (let i = 0; i < 25; i++) {
            let num;
            do {
                num = Math.floor(Math.random() * 75) + 1;
            } while (usedNumbers.has(num));
            usedNumbers.add(num);

            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = num;
            cell.onclick = () => cell.classList.toggle('marked');
            board.appendChild(cell);
        }

        function buyCard() {
            alert("ወደ ቻፓ የክፍያ ገጽ በመውሰድ ላይ... (ቴሌብር እና ሲቢኢ ብር)");
            // እዚህ ጋ ከ server.js /api/deposit ጋር ይገናኛል
        }
    </script>
</body>
</html>
